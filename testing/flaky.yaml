# joined by ' > '>", runner in {e2e, vitest}. status is one of open,
# quarantined, fixed. A `deadline` past first_seen+default_deadline_days
# needs `extended_reason`; every entry below carries one because the ledger
# started today (2026-09-27) with a shared deadline rather than each

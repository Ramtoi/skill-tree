[tool.ruff]
line-length = 120
target-version = "py39"
# Match .gitignore when linting an exported archive without Git metadata.
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E402", "E741", "F841", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "live_codex: live codex CLI gates — opt-in via RUN_LIVE_CODEX=1 (slow, needs auth)",
  "slow: tests that make a real (bounded) network dial — safe but not instant",
  "real_harness_paths: opt out of the harness agent/global-doc isolation guard (only for tests asserting the harness registry's declared literals)",
  "real_execution_supervisor: opt out of the fixture_launch patch in tests/harness_supervision_helpers.py (only for the non-darwin positive boundary test that must reach the production _launch/lock-path wiring)",
]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
follow_imports = "silent"

# Source packages copied file by file into the mutmut tree when not selected.
# The root `connectors/` namespace is a compatibility shim; its canonical
# implementation is covered by the `skill_hub/infrastructure/connectors`
# directory target above. The shim has its own mutation target.
source_dirs: [skill_hub, connectors]

# Non-source directories the tests read from the repo root.
copy_dirs: [hooks, scripts, docs, skills, mutation, app/src-tauri/tauri.conf.json, .github, .gitattributes]

# Tests that cannot run inside the mutmut copy. The copy has no .git, so a
# test that shells out to git in the repo fails before any mutant runs.
# Each entry is `file::test` (pytest deselect syntax) with a reason.
ignore_tests:
  - test: test_plugin_boundary.py::test_tracked_tree_has_no_private_plugin_references
    reason: git ls-files requires the real checkout
  - test: test_snapshot_machine.py::test_round_trip_journeys_pass
    reason: git ls-files requires the real checkout
  - test: test_snapshot_machine.py::test_snapshot_never_committed
    reason: git ls-files requires the real checkout
  # Wall-clock tests. mutmut runs one pytest per CPU core in parallel; a test
  # that races a real subprocess against a timeout flakes under that load and
  # would record a false kill.
  - test: test_mcp_probe.py::test_stdio_probe_process_exits_immediately
    reason: wall-clock child-process budget flakes under mutmut parallelism
